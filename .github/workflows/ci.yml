name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          # Track the latest stable that the dependencies support;
          # the MSRV floor is declared by workspace rust-version.
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Locate fxc.exe
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { throw "fxc.exe not found in the Windows SDK" }
          "GPUI_FXC_PATH=$($fxc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using $($fxc.FullName)"

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Test hymt-core
        shell: pwsh
        run: |
          # The server discovery test fails when llama-server is on PATH.
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and -not (Test-Path (Join-Path $_ 'llama-server.exe')) }) -join ';'
          # Loopback HTTP tests are flaky when run in parallel.
          cargo test -p hymt-core -- --test-threads=1

      - name: Test hymt-app
        run: cargo test -p hymt-app

      - name: Build release
        run: cargo build --release

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $name = "hymt-$version-windows-x64"
          $stage = "dist\$name"
          New-Item -ItemType Directory -Force "$stage\scripts" | Out-Null
          Copy-Item target\release\hymt.exe $stage
          Copy-Item README.md $stage
          Copy-Item scripts\setup-runtime.ps1 "$stage\scripts"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\$name.zip" -Force
          "zip=dist\$name.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          body: |
            - Windows 11용 오프라인 번역 앱 제공
            - 원문·번역 공통 글자 크기 조절 및 단축키 지원
            - llama.cpp 런타임과 모델 별도 설치 필요, README 안내 참고
          files: dist/*.zip
          fail_on_unmatched_files: true
