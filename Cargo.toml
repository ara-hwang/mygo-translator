[workspace]
resolver = "2"
members = ["crates/hymt-core", "crates/hymt-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
hymt-core = { path = "crates/hymt-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
